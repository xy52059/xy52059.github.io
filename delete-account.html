    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }

<body>
    <h1>账号及相关数据删除申请</h1>
    <p>如果您希望删除在 <strong>BigPic</strong> 应用中创建的账号及相关个人数据，您可以通过以下方式提交申请：</p>

    <div class="box">
        <h3>发送邮件申请</h3>
        <p>请使用您注册该账号时使用的邮箱，发送邮件至：<strong>xy872400t@gmail.com</strong></p>
        <p><strong>邮件主题：</strong>申请删除 BigPic 账号及数据</p>
        <p><strong>邮件内容建议包含：</strong>您的用户 ID 或注册邮箱。</p>
    </div>

    <h3>数据处理说明</h3>
    <ul>
        <li><strong>将被永久删除的数据：</strong>您的 Firebase 身份验证账号 (Auth ID)、关联的个人资料、个人存储记录及历史数据。</li>
        <li><strong>处理时间：</strong>我们在收到申请后的 <strong>7 个工作日内</strong> 完成数据清除并回复确认邮件。</li>
    </ul>
</body>
